name: Publish

# Manual dispatch only: tagging or creating a GitHub release never publishes.
# Build once, verify those exact files, then upload them after `pypi` approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    outputs:
      sha256sums: ${{ steps.hashes.outputs.sha256sums }}
    steps:
      - name: Require a release tag matching the package version
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Dispatch this workflow on a v* tag, not a branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against pyproject.toml version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match version $version (expected v$version)."
            exit 1
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build --no-sources --out-dir dist
      - name: Record SHA-256 manifest
        id: hashes
        run: |
          cd dist
          sha256sum * | tee ../SHA256SUMS
          {
            echo 'sha256sums<<EOF'
            cat ../SHA256SUMS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      XPINT_REQUIRE_WHEEL: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Provide the en_US locale used by the formatter tests
        run: sudo locale-gen en_US en_US.UTF-8
      - run: uv sync --locked --no-install-project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Check artifact against the build manifest
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: cd dist && printf '%s\n' "$SHA256SUMS" | sha256sum --strict -c -
      # The installed-artifact steps from ci.yml, without building.
      - run: uv pip install --no-deps dist/*.whl
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src tests examples benchmarks tools/check_minimal_install.py
      - run: uv run --no-sync twine check --strict dist/*
      - name: Verify installed wheel provenance
        run: uv run --no-sync python -c "import xpint; from pathlib import Path; assert 'site-packages' in Path(xpint.__file__).parts, xpint.__file__"
      - run: uv run --no-sync pytest
      - name: Verify minimal installation
        run: |
          uv venv .venv-minimal
          uv pip install --python .venv-minimal/bin/python dist/*.whl
          .venv-minimal/bin/python tools/check_minimal_install.py

  publish:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/xpint/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Check artifact against the build manifest
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: |
          cd dist
          printf '%s\n' "$SHA256SUMS" | sha256sum --strict -c -
          # Reject any file the manifest does not name.
          diff <(printf '%s\n' "$SHA256SUMS" | awk '{print $2}' | sort) <(ls -1 | sort)
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
