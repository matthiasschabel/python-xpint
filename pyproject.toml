[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xpint"
version = "0.1.0b1"
description = "xpint extends Pint with quantity kinds and unit designations: semantic information that keeps energy distinct from torque and mL[blood]/mL[tissue] distinct from a plain ratio."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Matthias C. Schabel"}]
dependencies = [
    "pint>=0.25.3,<0.26",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/matthiasschabel/python-xpint"
Documentation = "https://github.com/matthiasschabel/python-xpint/blob/main/README.md"
Issues = "https://github.com/matthiasschabel/python-xpint/issues"
Changelog = "https://github.com/matthiasschabel/python-xpint/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "babel>=2.18",
    "dask[array]>=2024.1",
    "matplotlib>=3.11.2",
    "mypy>=1.10",
    "numpy>=2.0",
    "pint-xarray>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=7.0.0",
    "uncertainties>=3.2",
    "xarray>=2024.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xpint"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/examples",
    "/pyproject.toml",
    "/src/xpint",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["AGENTS.md"]  # Generated guidance contains illustrative code blocks.

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"src/xpint/units.py" = ["N816"]
"src/xpint/registry.py" = ["UP040"]  # Pint requires runtime class attributes here.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples", "benchmarks"]
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --cov=xpint --cov-report=term-missing"
markers = [
    "slow: tests that take more than a few seconds",
    "network: tests that require network access",
]

[tool.coverage.run]
source = ["xpint"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
